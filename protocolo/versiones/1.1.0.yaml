# Protocolo de un estudio de mapeo sistemático (agentresearch, versión de esquema 1).
# Proceso: Kitchenham; mapeo: Petersen et al. (2008, 2015); reporte: PRISMA-ScR (Tricco et al., 2018).
# Validar con: agentresearch protocolo validar protocolo/protocolo.yaml
version_esquema: 1
# borrador mientras se construye; vigente desde su aprobación (todo cambio posterior es una enmienda).
estado: vigente
# Identificación, autoría y registro del protocolo (PRISMA-ScR, ítems 5 y 22).
metadatos:
  titulo: "Mucílago de café: obtención, caracterización y usos (estudio de demostración)"
  version_protocolo: "1.1.0"
  autores:
    - nombre: "Juan Pablo Gomez"
      orcid: "0009-0004-5255-0802"
      rol: "Investigador principal"
  registro:
    plataforma: "GitHub (repositorio público del estudio)"
    identificador: "Etiqueta de git protocolo-v1.0.0 sobre el commit de aprobación, con el anclaje del registro encadenado (decisión D17)"
    url: "https://github.com/PhDJP/demo-mucilago-cafe"
  financiacion: "Crédito educativo condonable, proyecto BPIN 2021000100129, Universidad del Cauca. El financiador no participa en el diseño, la selección, la extracción, el análisis, la interpretación ni la decisión de publicar."
# Por qué hace falta este mapeo y por qué un enfoque de alcance (PRISMA-ScR, ítem 3).
justificacion: "El mucílago de café representa alrededor del 17 % de la masa del fruto y es rico en pectinas y compuestos fenólicos (Machado y de Oliveira, 2023, doi:10.21577/0100-4042.20230052; Avallone et al., 2000, doi:10.1111/j.1365-2621.2000.tb10602.x; Vallejos-Jiménez et al., 2025, doi:10.1007/s12649-025-02926-9), además de azúcares fermentables. A pesar de su potencial agroindustrial, a juicio del investigador su aprovechamiento parece enfrentar barreras en la estabilización biológica, el escalamiento industrial y la estandarización fisicoquímica; este mapeo no parte de esa premisa como un hecho, sino que busca contrastarla con la literatura. Los trabajos previos consultados abordan los residuos del beneficio primario en conjunto (Serna-Jiménez et al., 2022, doi:10.3390/pr10112436), el uso de los subproductos del café en formulaciones tópicas (dos Santos et al., 2021, doi:10.1016/j.tifs.2021.02.064) o la valorización de la pulpa (Hu et al., 2023, doi:10.1016/j.crfs.2023.100475), pero ninguno se centra en el mucílago. El propósito de este mapeo es identificar qué tipos de usos, aplicaciones y desarrollos se han realizado a partir del mucílago de café y qué áreas se han investigado, para reconocer vacíos donde una investigación posterior pueda aportar. Se elige un mapeo sistemático y no una revisión sistemática porque el objetivo es describir la amplitud y la distribución de la literatura, no sintetizar la efectividad de una intervención (Petersen et al., 2015; Tricco et al., 2018)."
# Qué se busca conocer con el mapeo (PRISMA-ScR, ítem 4).
objetivos: "Identificar, clasificar y describir la literatura científica sobre el mucílago de café en tres dimensiones: (1) los métodos de obtención o separación del mucílago; (2) las propiedades fisicoquímicas, funcionales y biológicas que se han caracterizado y los métodos empleados para caracterizarlas; y (3) los usos, aplicaciones y desarrollos propuestos a partir de él. Además, registrar las limitaciones o barreras que los propios estudios reportan, en particular en la estabilización, el escalamiento y la estandarización del mucílago. Con ello, mapear cómo se distribuyen los estudios entre esas dimensiones y a lo largo del tiempo, identificar las áreas más y menos investigadas y señalar vacíos que orienten investigaciones posteriores."
pregunta_general: "¿Qué se ha investigado sobre la obtención, la caracterización y los usos del mucílago de café, cómo se distribuye esa investigación y qué vacíos presenta?"
# Preguntas con ID: las descriptivas dicen qué datos las responden; las analíticas, de qué cruces se derivan (PRISMA-ScR, ítem 4).
preguntas:
  - id: PI1
    texto: "¿Cómo ha evolucionado en el tiempo el número de publicaciones sobre el mucílago de café?"
    tipo: descriptiva
    responde_con: [DE1]
  - id: PI2
    texto: "¿Qué métodos de obtención o separación del mucílago de café se han estudiado?"
    tipo: descriptiva
    responde_con: [F1]
  - id: PI3
    texto: "¿Qué propiedades del mucílago de café se han caracterizado y con qué técnicas?"
    tipo: descriptiva
    responde_con: [F2, DE2]
  - id: PI4
    texto: "¿Qué usos, aplicaciones y desarrollos se han propuesto a partir del mucílago de café?"
    tipo: descriptiva
    responde_con: [F3]
  - id: PI5
    texto: "¿Qué limitaciones o barreras reportan los estudios sobre el mucílago de café?"
    tipo: descriptiva
    responde_con: [F4]
  - id: PI6
    texto: "¿En qué escala (laboratorio, piloto o industrial) se han desarrollado los estudios sobre el mucílago de café?"
    tipo: descriptiva
    responde_con: [F5]
  - id: PI7
    texto: "¿Qué combinaciones de método de obtención y tipo de aplicación del mucílago de café se han investigado y cuáles no?"
    tipo: analitica
    derivada_de:
      - [F1, F3]
  - id: PI8
    texto: "¿Qué barreras se reportan según el tipo de aplicación del mucílago de café?"
    tipo: analitica
    derivada_de:
      - [F3, F4]
  - id: PI9
    texto: "¿Qué aplicaciones del mucílago de café han llegado a escala piloto o industrial?"
    tipo: analitica
    derivada_de:
      - [F3, F5]
# Marco PCC (JBI) con su equivalencia PICOC (Kitchenham); el contexto no debería restringir la búsqueda (Petersen et al., 2015, §5.1.2).
marco:
  pcc:
    poblacion:
      descripcion: "Mucílago de café (mesocarpio) obtenido como subproducto del beneficio del café, de cualquier especie de Coffea. Se excluyen las aguas mieles (decisión D1). Los estudios que trabajan el mucílago mezclado con otros subproductos se incluyen solo si reportan resultados propios para el mucílago (decisión D2). Se incluyen los estudios sobre la remoción o separación del mucílago del grano, por ser su obtención, pero no los que estudian su retención en el grano para la calidad de la taza, como el proceso honey (decisión D4)."
      terminos: ["coffee", "Coffea", "mucilag*", "\"coffee mucilage\"", "\"mucilage layer\"", "\"sticky layer\"", "\"gelatinous layer\"", "\"viscous residue\"", "\"mucilaginous layer\"", "\"mucilaginous coat\""]
    concepto:
      descripcion: "Obtención o separación del mucílago; su caracterización fisicoquímica, funcional y biológica; y sus usos, aplicaciones y desarrollos."
      terminos: []
    contexto:
      descripcion: "Abierto: cualquier país o región, cualquier tipo de beneficio y cualquier sector de aplicación. El contexto se usa para describir los estudios, no para restringir la búsqueda."
      terminos: []
      restrictivo: false
  equivalencia_picoc:
    population: "Mucílago de café como subproducto del beneficio del café."
    intervention: "Obtención, caracterización y usos del mucílago."
    comparison: "No aplica: el mapeo no compara intervenciones."
    outcome: "Métodos de obtención, propiedades caracterizadas, aplicaciones, barreras reportadas y escala de los estudios."
    context: "Abierto: cualquier país, tipo de beneficio y sector."
# Fuentes de información, con su cobertura y los límites aplicados (PRISMA-ScR, ítem 7).
fuentes:
  - id: scopus
    tipo: exportacion
    cobertura: "Scopus (Elsevier), base multidisciplinaria de resúmenes y citas, consultada con el acceso institucional de la Universidad del Cauca."
    limites: "Búsqueda en título, resumen y palabras clave (TITLE-ABS-KEY). Sin límites adicionales a los de periodo, idioma y tipo de documento declarados en la sección busqueda."
  - id: wos
    tipo: exportacion
    cobertura: "Web of Science Core Collection (Clarivate), consultada con el acceso institucional de la Universidad del Cauca, con las ediciones Science Citation Index Expanded (SCI-EXPANDED), Social Sciences Citation Index (SSCI), Arts & Humanities Citation Index (A&HCI) y Emerging Sources Citation Index (ESCI)."
    limites: "La suscripción cubre las cuatro ediciones desde 2006; los registros anteriores no son recuperables en esta fuente. Búsqueda en el campo Topic (TS: título, resumen, palabras clave del autor y Keywords Plus) con todas las ediciones suscritas seleccionadas. Sin límites adicionales a los declarados en la sección busqueda."
  - id: openalex
    tipo: api
    cobertura: "OpenAlex, catálogo abierto y multidisciplinario de trabajos académicos, consultado por su API pública; complementa a Scopus y Web of Science con revistas regionales y en idiomas distintos del inglés."
    limites: "Búsqueda en título y resumen (filtro title_and_abstract.search). Sin límites adicionales a los declarados en la sección busqueda."
  - id: pubmed
    tipo: api
    cobertura: "PubMed (National Library of Medicine), literatura biomédica y de ciencias de la vida, incluidas nutrición y ciencia de alimentos, consultada por su API pública (E-utilities)."
    limites: "Búsqueda en título y resumen ([tiab]). Su cobertura es principalmente biomédica, por lo que se espera que aporte sobre todo estudios de propiedades biológicas y usos alimentarios o farmacéuticos del mucílago. Sin límites adicionales a los declarados en la sección busqueda."
# Estrategias de identificación, conjunto de validación y criterio de parada (Petersen et al., 2015, §5.1.2 y tabla 10).
estrategias:
  bases_de_datos:
    activa: true
  bola_de_nieve:
    activa: true
    direcciones: [atras]
  busqueda_manual:
    activa: false
    fuentes: []
  conjunto_validacion:
    activo: true
    articulos:
      - doi: "10.21577/0100-4042.20230052"
        titulo: "Functional and technological properties of coffee mucilage (Coffea arabica) and its application in edible films"
        como_se_conoce: "Referencia previa del investigador, conocida antes de la búsqueda."
      - doi: "10.1007/s12649-025-02926-9"
        titulo: "Development of Novel Pectin-Based Films from Coffee Waste: Mucilage and Pulp"
