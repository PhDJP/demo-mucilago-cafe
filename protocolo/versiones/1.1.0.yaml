    valor: 0
    justificacion: "La bola de nieve hacia atrás se itera hasta que una ronda no aporte ningún estudio nuevo incluido (saturación; Wohlin, 2014; decisión D6)."
# Bloques de búsqueda: OR dentro de cada bloque, AND entre bloques; términos como palabra, palabra* o "frase", y variantes opcionales de los truncados; periodo e idiomas (ISO 639-1) con justificación (PRISMA-ScR, ítems 6 y 8; ADR-0009).
busqueda:
  bloques:
    - id: B1
      nombre: "Café"
      componente: poblacion
      terminos: ["coffee", "Coffea", "café", "cafe", "cafeeiro"]
    - id: B2
      nombre: "Mucílago"
      componente: poblacion
      terminos: ["mucilag*", "\"coffee mucilage\"", "\"mucilage layer\"", "\"sticky layer\"", "\"gelatinous layer\"", "\"viscous residue\"", "\"mucilaginous layer\"", "\"mucilaginous coat\"", "mucílago", "\"mucílago de café\"", "\"mucilago de cafe\"", "\"mucílago del café\"", "\"mucilago del cafe\"", "\"capa de mucílago\"", "\"capa de mucilago\"", "\"capa mucilaginosa\"", "\"cubierta mucilaginosa\"", "\"capa pegajosa\"", "\"capa gelatinosa\"", "\"residuo viscoso\"", "\"mucilagem de café\"", "\"mucilagem de cafe\"", "\"mucilagem do café\"", "\"mucilagem do cafe\"", "\"camada de mucilagem\"", "\"camada mucilaginosa\"", "\"revestimento mucilaginoso\"", "\"camada pegajosa\"", "\"camada gelatinosa\"", "\"resíduo viscoso\""]
  periodo:
    desde: null
    hasta: null
    justificacion: "Sin límite inicial y hasta la fecha de la búsqueda, para mostrar la evolución completa del tema (PI1). Web of Science solo cubre desde 2006 en la suscripción institucional; los estudios anteriores se recuperan por Scopus, OpenAlex, PubMed y la bola de nieve hacia atrás (decisión D9)."
  idiomas:
    valores: [en, es, pt]
    justificacion: "Inglés, español y portugués: la literatura sobre el mucílago de café proviene sobre todo de países productores de habla hispana y portuguesa, y son idiomas que el investigador puede leer (decisión D7)."
  tipos_documento: []
# Criterios con ID, fase (titulo_resumen, texto_completo o ambas), tipo y ejemplos (PRISMA-ScR, ítem 6; Petersen et al., 2015, §5.1.2).
criterios:
  inclusion:
    - id: CI1
      texto: "El estudio obtiene o separa, caracteriza o usa como materia prima el mucílago de café procedente del beneficio, de cualquier especie de Coffea."
      fase: titulo_resumen
      tipo: tema
      ejemplos_si: ["Machado y de Oliveira (2023): caracterización del mucílago y su uso en películas comestibles", "Ccalli Pacco (2024): modelado de la remoción del mucílago por fermentación"]
      ejemplos_no: ["Hu et al. (2023): valorización de la pulpa de café", "Un estudio del cultivo o de la planta de café sin relación con el mucílago"]
    - id: CI2
      texto: "Es un estudio primario publicado como artículo de revista, ponencia en actas, tesis de maestría o doctorado, o capítulo de libro."
      fase: ambas
      tipo: tipo_documento
      ejemplos_si: ["Machado y de Oliveira (2023): artículo de revista", "Ccalli Pacco (2024): ponencia publicada en Procedia Computer Science"]
      ejemplos_no: ["Serna-Jiménez et al. (2022): revisión de literatura", "Una patente o un informe técnico"]
    - id: CI3
      texto: "Está escrito en inglés, español o portugués."
      fase: ambas
      tipo: idioma
      ejemplos_si: ["Un artículo en portugués sobre películas de mucílago de café"]
      ejemplos_no: ["Un artículo escrito en chino o en indonesio"]
  exclusion:
    - id: CE1
      texto: "Estudia las aguas mieles (aguas residuales del lavado del café) y no el mucílago recuperado como material (decisión D1)."
      fase: ambas
      tipo: tema
      ejemplos_si: ["Un estudio de tratamiento anaerobio de las aguas mieles del beneficio húmedo"]
      ejemplos_no: ["Un estudio de producción de etanol a partir de mucílago recuperado", "Un estudio que caracteriza el mucílago separado por desmucilaginado mecánico, aunque mencione las aguas mieles como otro residuo del beneficio"]
    - id: CE2
      texto: "Trabaja el mucílago mezclado con otros subproductos del café sin reportar resultados propios para el mucílago (decisión D2)."
      fase: ambas
      tipo: tema
      ejemplos_si: ["Un estudio de compostaje de pulpa y mucílago que solo reporta resultados de la mezcla"]
      ejemplos_no: ["Vallejos-Jiménez et al. (2025): extrae y compara la pectina del mucílago y de la pulpa por separado"]
    - id: CE3
      texto: "Estudia la retención del mucílago sobre el grano o su efecto en la calidad de la taza (por ejemplo, el proceso honey), sin obtener, caracterizar ni usar el mucílago como tal (decisión D4)."
      fase: ambas
      tipo: tema
      ejemplos_si: ["Aswathi y Murthy (2024): proceso pulped natural/honey", "Hu et al. (2025): volátiles y microbiota del café según la retención del mucílago"]
      ejemplos_no: ["Ccalli Pacco (2024): modela la remoción del mucílago, que es su obtención"]
    - id: CE4
      texto: "No es un estudio primario: revisión de literatura, editorial, carta, nota o resumen de congreso sin texto completo. Las revisiones se usan en la bola de nieve hacia atrás (decisión D5)."
      fase: ambas
      tipo: tipo_documento
      ejemplos_si: ["Serna-Jiménez et al. (2022): revisión de los residuos del beneficio primario", "dos Santos et al. (2021): revisión de subproductos del café en formulaciones tópicas"]
      ejemplos_no: ["Machado y de Oliveira (2023): estudio experimental"]
    - id: CE5
      texto: "Es un duplicado: reporta el mismo estudio que otro documento incluido; se conserva el artículo de revista frente a la tesis, la ponencia o el capítulo (decisión D11)."
      fase: texto_completo
      tipo: otro
      ejemplos_si: ["Vallejos Jiménez (2022): tesis de la Universidad Nacional de Colombia que reporta el mismo estudio que Vallejos-Jiménez et al. (2025)"]
      ejemplos_no: ["Vallejos-Jiménez et al. (2025): el artículo que se conserva"]
    - id: CE6
      texto: "No se puede obtener el texto completo por las vías institucionales ni solicitándolo a los autores."
      fase: texto_completo
      tipo: otro
      ejemplos_si: ["Un artículo sin acceso institucional cuyos autores no responden la solicitud"]
      ejemplos_no: ["Un artículo obtenido por préstamo interbibliotecario o enviado por los autores"]
# Revisores, regla de combinación A-F, piloto de concordancia y lote del LLM (PRISMA-ScR, ítem 9; Petersen et al., 2015, tabla 6).
seleccion:
  revisores:
    - id: investigador-1
      tipo: humano
    - id: claude
      tipo: llm
  regla_combinacion:
    avanzan: [A, B, C, D, E]
  piloto:
    tamano: 50
    umbral_kappa: 0.61
  tamano_lote_llm: 25
# Formulario de extracción y facetas de clasificación con definición, regla y ejemplos (PRISMA-ScR, ítems 10 y 11; Wohlin et al., 2013).
extraccion:
  items:
    - id: DE1
      nombre: "Año de publicación"
      descripcion: "Año de publicación del documento; para las tesis, año de sustentación o depósito."
      tipo: numero
      preguntas: [PI1]
    - id: DE2
      nombre: "Técnicas de caracterización"
      descripcion: "Técnicas analíticas usadas para caracterizar el mucílago, tal como las nombran los autores (por ejemplo, HPLC, FTIR, reología rotacional, DPPH)."
      tipo: texto
      preguntas: [PI3]
  facetas:
    - id: F1
      nombre: "Método de obtención o separación del mucílago"
      origen: emergente
      multiple: true
      categorias:
        - id: F1.1
          nombre: "Mecánico o manual"
          definicion: "El mucílago se separa del grano por acción física: desmucilaginado por fricción, centrifugación, prensado, tamizado o disección manual."
          regla: "Asignar si el estudio describe una separación física del mucílago, sola o combinada con otro método."
          ejemplos: ["Avallone et al. (2000): mucílago obtenido por disección manual y mucílago comercial"]
        - id: F1.2
          nombre: "Enzimático"
          definicion: "El mucílago se separa o se hidroliza con enzimas, como pectinasas comerciales."
          regla: "Asignar si el método incluye un tratamiento enzimático del mucílago o del grano despulpado."
          ejemplos: ["Rivera Escobar et al. (2025): obtención por hidrólisis con pectinasas comerciales"]
        - id: F1.3
          nombre: "Fermentativo"
          definicion: "El mucílago se degrada o se remueve por fermentación natural o inducida."
          regla: "Asignar si el estudio obtiene, remueve o modela la remoción del mucílago por fermentación."
          ejemplos: ["Ccalli Pacco (2024): modelado de la remoción del mucílago en fermentación espontánea"]
        - id: F1.4
          nombre: "Químico"
          definicion: "El mucílago se separa con agentes químicos, como soluciones ácidas o alcalinas."
          regla: "Asignar si el método de separación del mucílago emplea un agente químico distinto de las enzimas."
          ejemplos: ["Un estudio que separa el mucílago del grano con una solución alcalina"]
        - id: F1.5
          nombre: "No reportado"
          definicion: "El estudio usa o caracteriza el mucílago sin describir cómo se obtuvo."
          regla: "Asignar solo si el texto completo no describe el método de obtención."
          ejemplos: ["Un estudio que caracteriza un mucílago suministrado por una finca sin describir su separación"]
        - id: F1.6
          nombre: "Otro"
          definicion: "Método de obtención que no corresponde a las categorías anteriores."
          regla: "Asignar y describir el método; los casos recurrentes se proponen como categoría nueva tras el piloto (decisión D15)."
          ejemplos: ["Un método de obtención asistido por ultrasonido"]
    - id: F2
      nombre: "Propiedad caracterizada"
      origen: emergente
      multiple: true
      categorias:
        - id: F2.1
          nombre: "Composición química"
          definicion: "Análisis proximal, azúcares, pectinas y otros polisacáridos, proteínas, minerales."
          regla: "Asignar si el estudio mide la composición química del mucílago."
          ejemplos: ["Avallone et al. (2000): constituyentes polisacáridos del mucílago"]
        - id: F2.2
          nombre: "Compuestos bioactivos y actividad biológica"
          definicion: "Compuestos fenólicos, capacidad antioxidante, actividad antimicrobiana o prebiótica."
          regla: "Asignar si el estudio cuantifica compuestos bioactivos o una actividad biológica del mucílago."
          ejemplos: ["Otálora et al. (2024): capacidad antioxidante, fenoles y actividad prebiótica del mucílago en polvo", "Rivera Escobar et al. (2025): fenoles totales y capacidad antioxidante"]
        - id: F2.3
          nombre: "Propiedades fisicoquímicas, térmicas y reológicas"
          definicion: "pH, sólidos solubles, color, actividad de agua, isotermas de sorción, transición vítrea, tamaño de partícula, viscosidad y comportamiento reológico."
          regla: "Asignar si el estudio mide propiedades físicas, térmicas, estructurales o reológicas del mucílago o de su polvo."
          ejemplos: ["Rivera Escobar et al. (2025): transición vítrea, isotermas de sorción y tamaño de partícula del mucílago en polvo"]
        - id: F2.4
          nombre: "Propiedades funcionales y tecnológicas"
          definicion: "Capacidad emulsificante, gelificante, formadora de películas, de retención de agua o de aceite."
          regla: "Asignar si el estudio evalúa el desempeño del mucílago como ingrediente o material."
          ejemplos: ["Machado y de Oliveira (2023): propiedades funcionales y tecnológicas del mucílago", "Otálora et al. (2024): capacidad y estabilidad de emulsificación"]
        - id: F2.5
          nombre: "Microbiológica"
          definicion: "Microbiota, carga microbiana o microorganismos asociados al mucílago."
          regla: "Asignar si el estudio caracteriza los microorganismos presentes en el mucílago."
          ejemplos: ["Un estudio que identifica las levaduras y bacterias del mucílago recién separado"]
        - id: F2.6
          nombre: "No caracteriza"
          definicion: "El estudio no reporta ninguna caracterización del mucílago."
          regla: "Asignar solo si no aplica ninguna de las categorías F2.1 a F2.5 ni F2.7."
          ejemplos: ["Ccalli Pacco (2024): modelado de la remoción sin caracterizar el mucílago"]
        - id: F2.7
          nombre: "Otra"
          definicion: "Propiedad caracterizada que no corresponde a las categorías anteriores."
          regla: "Asignar y describir la propiedad; los casos recurrentes se proponen como categoría nueva tras el piloto (decisión D15)."
          ejemplos: ["Un análisis sensorial del mucílago"]
    - id: F3
      nombre: "Tipo de aplicación"
      origen: emergente
      multiple: true
      categorias:
        - id: F3.1
          nombre: "Ingrediente o aditivo alimentario"
          definicion: "Uso del mucílago o de sus derivados en alimentos o bebidas: hidrocoloide, ingrediente funcional, encapsulado."
          regla: "Asignar si el estudio propone o prueba el mucílago como componente de un alimento o bebida."
          ejemplos: ["Otálora et al. (2024): mucílago en polvo como hidrocoloide alimentario", "Ríos-Hernández et al. (2024): microcápsulas de mucílago como ingrediente funcional"]
        - id: F3.2
          nombre: "Materiales y empaques"
          definicion: "Películas, recubrimientos, bioplásticos y otros materiales."
          regla: "Asignar si el mucílago o un derivado forma parte de un material."
          ejemplos: ["Machado y de Oliveira (2023): películas comestibles", "Vallejos-Jiménez et al. (2025): películas de pectina del mucílago"]
        - id: F3.3
          nombre: "Bioenergía y biocombustibles"
          definicion: "Producción de etanol, biogás, hidrógeno u otros vectores energéticos a partir del mucílago."
          regla: "Asignar si el producto principal del estudio es un vector energético."
          ejemplos: ["Optimization and Scale-Up of Coffee Mucilage Fermentation for Ethanol Production (Energies, 2018, doi:10.3390/en11040786)"]
        - id: F3.4
          nombre: "Bioproductos y compuestos extraídos"
          definicion: "Obtención de compuestos o bioproductos a partir del mucílago: pectina, ácidos orgánicos, enzimas, o su uso como medio de fermentación."
          regla: "Asignar si el mucílago es materia prima para extraer o producir un compuesto distinto de un vector energético."
          ejemplos: ["Vallejos-Jiménez et al. (2025): extracción de pectina del mucílago con ácido cítrico"]
        - id: F3.5
          nombre: "Farmacéutica y cosmética"
          definicion: "Uso del mucílago en formulaciones farmacéuticas, nutracéuticas o cosméticas."
          regla: "Asignar si el estudio propone o prueba el mucílago en una formulación de este tipo."
          ejemplos: ["Un estudio que incorpora extracto de mucílago en una crema tópica"]
        - id: F3.6
          nombre: "Agrícola y pecuaria"
          definicion: "Fertilizantes, bioinsumos, enmiendas de suelo o alimento animal."
          regla: "Asignar si el mucílago se usa en la producción agrícola o animal."
          ejemplos: ["Un estudio que usa el mucílago como sustrato para un biofertilizante"]
        - id: F3.7
          nombre: "Sin aplicación"
          definicion: "El estudio obtiene o caracteriza el mucílago sin proponer ni probar un uso."
          regla: "Asignar solo si el estudio no propone ni prueba ninguna aplicación."
          ejemplos: ["Avallone et al. (2000): caracterización de polisacáridos sin aplicación", "Ccalli Pacco (2024): modelado de la remoción"]
        - id: F3.8
          nombre: "Otra"
          definicion: "Aplicación que no corresponde a las categorías anteriores."
          regla: "Asignar y describir la aplicación; los casos recurrentes se proponen como categoría nueva tras el piloto (decisión D15)."
          ejemplos: ["Un uso del mucílago como adsorbente para tratar agua"]
    - id: F4
      nombre: "Barrera reportada"
      origen: emergente
      multiple: true
      categorias:
        - id: F4.1
          nombre: "Estabilidad y conservación"
          definicion: "Deterioro o fermentación espontánea del mucílago, carga microbiana, higroscopicidad o vida útil corta."
          regla: "Asignar si los autores señalan la inestabilidad del mucílago o de su producto como limitación."
          ejemplos: ["Rivera Escobar et al. (2025): el polvo sigue siendo muy higroscópico y exige empaques de baja permeabilidad"]
        - id: F4.2
          nombre: "Escalamiento y costos"
          definicion: "Dificultades para pasar a mayor escala, costos de proceso, logística de recolección o viabilidad económica."
          regla: "Asignar si los autores señalan limitaciones de escala, costo o logística."
          ejemplos: ["Un estudio que señala que el costo del secado impide la producción comercial"]
        - id: F4.3
          nombre: "Variabilidad y estandarización"
          definicion: "Variación de la composición del mucílago según variedad, madurez, región o proceso, o falta de métodos estandarizados."
          regla: "Asignar si los autores señalan la variabilidad de la materia prima o la falta de estandarización."
          ejemplos: ["Un estudio que atribuye diferencias de composición a la variedad y la madurez del fruto"]
        - id: F4.4
          nombre: "Desempeño técnico insuficiente"
          definicion: "El producto o material obtenido no alcanza las propiedades requeridas (por ejemplo, alta solubilidad o baja resistencia mecánica)."
          regla: "Asignar si los autores señalan que el desempeño del producto limita su uso o exige mejoras."
          ejemplos: ["Vallejos-Jiménez et al. (2025): alta solubilidad de las películas de pectina, que requieren agentes de refuerzo"]
        - id: F4.5
          nombre: "Inocuidad y regulación"
          definicion: "Riesgos de inocuidad, toxicidad o barreras regulatorias para el uso del mucílago."
          regla: "Asignar si los autores señalan riesgos de inocuidad o requisitos regulatorios como limitación."
          ejemplos: ["Un estudio que advierte sobre micotoxinas en el mucílago para uso alimentario"]
        - id: F4.6
          nombre: "No reporta barreras"
          definicion: "El estudio no señala limitaciones ni barreras para el uso del mucílago."
          regla: "Asignar solo si no aplica ninguna de las categorías F4.1 a F4.5 ni F4.7."
          ejemplos: ["Un estudio de caracterización que no discute limitaciones"]
        - id: F4.7
          nombre: "Otra"
          definicion: "Barrera que no corresponde a las categorías anteriores."
          regla: "Asignar y describir la barrera; los casos recurrentes se proponen como categoría nueva tras el piloto (decisión D15)."
          ejemplos: ["Una barrera de aceptación por parte de los productores"]
    - id: F5
      nombre: "Escala del estudio"
      origen: emergente
      multiple: false
      categorias:
        - id: F5.1
          nombre: "Simulación o modelado"
          definicion: "Estudio sin experimentación física: modelos matemáticos, simulación o análisis tecnoeconómico teórico."
          regla: "Asignar si el estudio no procesa mucílago real."
          ejemplos: ["Ccalli Pacco (2024): modelado con lógica difusa"]
        - id: F5.2
          nombre: "Laboratorio"
          definicion: "Experimentación con equipos de laboratorio y cantidades de gramos o pocos litros."
          regla: "Asignar si la mayor escala alcanzada en el estudio es de laboratorio."
          ejemplos: ["Machado y de Oliveira (2023): películas obtenidas por vaciado en laboratorio"]
        - id: F5.3
          nombre: "Piloto"
          definicion: "Procesamiento en equipos que los autores declaran de escala piloto, o de decenas a cientos de kilogramos o litros."
          regla: "Asignar si la mayor escala alcanzada es piloto."
          ejemplos: ["Rivera Escobar et al. (2025): secado por aspersión en un secador de escala piloto"]
        - id: F5.4
          nombre: "Industrial o comercial"
          definicion: "Procesamiento en planta industrial o producto en el mercado."
          regla: "Asignar si la mayor escala alcanzada es industrial o si el producto se comercializa."
          ejemplos: ["Un estudio de un producto de mucílago elaborado en una planta industrial"]
        - id: F5.5
          nombre: "No determinable"
          definicion: "El texto completo no permite establecer la escala."
          regla: "Asignar solo si la escala no puede inferirse del texto completo."
          ejemplos: ["Un estudio que no describe los equipos ni las cantidades procesadas"]
# Evaluación de calidad, opcional en los mapeos (PRISMA-ScR, ítem 12).
calidad:
  activa: false
  preguntas: []
# Plan de síntesis y cruces de facetas para los mapas (PRISMA-ScR, ítem 13; Petersen et al., 2015, §5.1.4).
analisis:
  plan: "Síntesis descriptiva y gráfica, sin metaanálisis. (1) Proceso: se reportan el diagrama de flujo PRISMA-ScR con los registros por fuente, los duplicados, las exclusiones por criterio y los estudios añadidos por la bola de nieve hacia atrás; la recuperación del conjunto de validación por cada ecuación; la kappa de Cohen del piloto entre el investigador y el LLM (umbral 0,61; Landis y Koch, 1977), y la kappa intraevaluador del test-retest sobre una muestra aleatoria de 50 registros recribada al menos dos semanas después sin ver las decisiones anteriores (decisiones D12 y D14). (2) Preguntas descriptivas: PI1 con la serie anual de publicaciones (DE1); PI2 a PI6 con tablas de frecuencias y porcentajes por categoría de F1 a F5 (en las facetas múltiples, un estudio puede sumar en varias categorías, por lo que se reporta además el número de estudios); PI3 se complementa con una síntesis narrativa de las técnicas de caracterización (DE2). (3) Preguntas analíticas: mapas de burbujas (Petersen et al., 2008) para los cruces F1 x F3 (PI7), F3 x F4 (PI8) y F3 x F5 (PI9); las celdas vacías o con pocos estudios se señalan como vacíos de investigación, y el cruce F3 x F4 se usa para contrastar la premisa del investigador sobre las barreras de estabilización, escalamiento y estandarización (F4.1 a F4.3). (4) Las categorías Otro u Otra con casos recurrentes tras el piloto se proponen como categorías nuevas mediante una enmienda (decisión D15)."
  cruces:
    - [F1, F3]
    - [F3, F4]
    - [F3, F5]
