# Proyecto uv del estudio: fija la versión exacta de agentresearch; uv.lock se versiona.
[project]
name = "demo-mucilago-cafe"
version = "0.0.0"
description = "Datos y evidencia de un estudio de mapeo sistemático conducido con agentresearch."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentresearch @ git+https://github.com/PhDJP/agentresearch@v0.1.0rc2",
]

[tool.uv]
# El estudio no es un paquete: uv solo instala sus dependencias.
package = false
